{% extends 'layouts/base.html' %}
{% block title %}
    <title>User Profile | HealthPulse</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
{% endblock title %}
{% block content %}
<main class="main">
    <div class="main_wrapper" style="text-align: center; padding: 60px 20px;">
        <div style="max-width: 500px; margin: 0 auto; background: #ffffff; border: 1px solid var(--hp-border); border-radius: var(--hp-radius-lg); padding: 40px 32px; box-shadow: var(--hp-shadow-md);">
            <div style="width: 72px; height: 72px; border-radius: 50%; background: #fff0ee; color: #ff574d; display: inline-flex; align-items: center; justify-content: center; font-size: 36px; margin-bottom: 20px;">
                <i class='bx bx-user'></i>
            </div>
            <h2 style="font-size: 22px; font-weight: 700; color: var(--hp-ink); margin-bottom: 10px;">User Profile</h2>
            <p style="font-size: 14.5px; color: var(--hp-muted); line-height: 1.6; margin-bottom: 24px;">
                Manage your account credentials, personal health metrics, and saved reports directly in your profile dashboard.
            </p>
            <a href="{{ url_for('my_profile') }}" class="btn" style="display: inline-flex; align-items: center; gap: 8px;">
                <i class='bx bx-id-card'></i> Open My Profile
            </a>
        </div>
    </div>
</main>
{% endblock content %}
